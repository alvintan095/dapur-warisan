<!doctype html>
<html lang="id-ID">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Masuk — Dapur Warisan</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;0,700;1,500&family=Nunito:wght@400;500;600;700;800&display=swap" />
    <link rel="stylesheet" href="style.css" />
    <script>
      if (localStorage.getItem('dapur-warisan-dark') === '1') document.documentElement.classList.add('dark');
      if (localStorage.getItem('dapur-warisan-user')) location.replace('beranda.html');
    </script>
  </head>
  <body data-page="auth">
    <div id="auth" class="auth">
      <aside class="auth-hero">
        <img src="https://images.unsplash.com/photo-1539755530862-00f623c00f52?w=1400&h=1050&fit=crop&auto=format" alt="Meja makan penuh hidangan rumahan Indonesia" />
        <div class="auth-hero-text">
          <div class="brand-text"><i data-lucide="book-heart" class="accent"></i> Dapur Warisan</div>
          <div>
            <p class="quote">Resep terbaik adalah yang diwariskan dengan cinta.</p>
            <p>Simpan resep keluarga, susun menu mingguan, dan belanja tanpa lupa, berbagi bersama-sama.</p>
          </div>
        </div>
      </aside>

      <main class="auth-panel">
        <div class="auth-box">
          <div class="brand-text mobile-only"><i data-lucide="book-heart" class="primary"></i> Dapur Warisan</div>
          <h1 id="auth-title" class="title">Selamat datang kembali</h1>
          <p id="auth-subtitle" class="muted">Masuk untuk melihat resep dan menu keluarga.</p>

          <div class="tabs" role="tablist">
            <button type="button" class="tab is-active" data-tab="masuk" role="tab">Masuk</button>
            <button type="button" class="tab" data-tab="daftar" role="tab">Daftar</button>
          </div>

          <form id="auth-form" class="stack" novalidate>
            <label class="field only-register">
              <span>Nama lengkap</span>
              <input name="nama" placeholder="Nama Anda" />
              <small class="error" data-error="nama"></small>
            </label>
            <label class="field">
              <span>Email</span>
              <input name="email" type="email" placeholder="nama@email.com" />
              <small class="error" data-error="email"></small>
            </label>
            <label class="field">
              <span>Password</span>
              <div class="input-with-button">
                <input name="password" type="password" placeholder="Minimal 6 karakter" />
                <button type="button" id="toggle-password" class="icon-only" aria-label="Tampilkan password"><i data-lucide="eye"></i></button>
              </div>
              <small class="error" data-error="password"></small>
            </label>
            <label class="field only-register">
              <span>Kode keluarga (opsional)</span>
              <input name="kode" class="code-input" placeholder="KODE-1234" />
              <small class="hint">Minta kode ke admin keluarga, atau kosongkan untuk membuat grup baru.</small>
            </label>
            <div class="right only-login"><button type="button" class="link">Lupa password?</button></div>
            <button type="submit" id="auth-submit" class="btn btn-primary btn-block btn-lg">Masuk</button>
          </form>
        </div>
      </main>
    </div>

    <div id="toast" class="toast" role="status" hidden></div>

    <script src="lucide.min.js"></script>
    <script src="app.js"></script>
  </body>
</html>
